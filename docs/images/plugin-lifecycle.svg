<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" role="img" aria-label="插件生命周期（第二阶段）" xmlns:c2pa="http://c2pa.org/manifest">
<title>插件生命周期（第二阶段）</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f3f46"/></marker>
<marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f3f46"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="600" y="42" font-size="24" font-weight="700" text-anchor="middle" fill="#18181b">插件生命周期（第二阶段）</text>
<text x="600" y="68" font-size="14" font-weight="400" text-anchor="middle" fill="#52525b">插件之间没有依赖关系，所以只有三个状态，不需要依赖编排和级联</text>
<rect x="60" y="170" width="200" height="70" rx="35" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
<text x="160.0" y="202.0" font-size="17" font-weight="600" text-anchor="middle" fill="#52525b">已安装 · 已停用</text>
<text x="160.0" y="220.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52525b">jar 在插件目录，未加载</text>
<rect x="500" y="170" width="200" height="70" rx="35" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="600.0" y="202.0" font-size="17" font-weight="600" text-anchor="middle" fill="#15803d">已启用</text>
<text x="600.0" y="220.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52525b">注册的东西都生效</text>
<rect x="500" y="370" width="200" height="70" rx="35" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="600.0" y="402.0" font-size="17" font-weight="600" text-anchor="middle" fill="#b91c1c">失败</text>
<text x="600.0" y="420.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52525b">界面显示原因</text>
<rect x="940" y="170" width="200" height="70" rx="10" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
<text x="1040.0" y="202.0" font-size="17" font-weight="600" text-anchor="middle" fill="#52525b">已卸载</text>
<text x="1040.0" y="220.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52525b">jar 已删除</text>
<rect x="60" y="370" width="200" height="70" rx="10" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
<text x="160.0" y="402.0" font-size="17" font-weight="600" text-anchor="middle" fill="#52525b">安装</text>
<text x="160.0" y="420.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52525b">放入 jar / 插件市场下载</text>
<line x1="160" y1="370" x2="160" y2="244" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="172" y="312" font-size="12.5" font-weight="400" text-anchor="start" fill="#27272a">新装的默认停用</text>
<line x1="260" y1="192" x2="496" y2="192" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="378.0" y="182" font-size="12.5" font-weight="400" text-anchor="middle" fill="#27272a">用户点“启用”</text>
<line x1="496" y1="222" x2="264" y2="222" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="380.0" y="242" font-size="12.5" font-weight="400" text-anchor="middle" fill="#27272a">用户点“停用”</text>
<line x1="600" y1="240" x2="600" y2="366" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="612" y="296" font-size="12.5" font-weight="400" text-anchor="start" fill="#27272a">启用过程中：清单不合法 / 版本不兼容 /</text>
<text x="612" y="314" font-size="12.5" font-weight="400" text-anchor="start" fill="#18181b">start() 抛异常 / 工具重名</text>
<path d="M 500 405 C 330 405, 300 300, 230 248" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="300" y="352" font-size="12.5" font-weight="400" text-anchor="start" fill="#18181b">回到停用，修复后再启用</text>
<path d="M 700 205 L 936 205" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="818" y="195" font-size="12.5" font-weight="400" text-anchor="middle" fill="#18181b">卸载（先停用）</text>
<rect x="60" y="480" width="1080" height="100" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="80" y="506" font-size="15" font-weight="700" text-anchor="start" fill="#6d28d9">启用 / 停用时宿主做的事</text>
<text x="80" y="532" font-size="12.5" font-weight="400" text-anchor="start" fill="#18181b">启用：读清单、检查 api-version → 新建独立类加载器 → 调用 start(ctx)：插件注册的工具、提示词段落、钩子、订阅都记进它的账本</text>
<text x="80" y="556" font-size="12.5" font-weight="400" text-anchor="start" fill="#18181b">停用：调用 stop() → 按账本逆序撤销所有注册 → 关闭类加载器。插件作者不用写任何“反注册”代码</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
