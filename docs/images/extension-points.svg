<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" role="img" aria-label="LiHarness 扩展点" xmlns:c2pa="http://c2pa.org/manifest">
<title>LiHarness 扩展点</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f3f46"/></marker>
<marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f3f46"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="600" y="42" font-size="24" font-weight="700" text-anchor="middle" fill="#18181b">内核主链路与扩展点</text>
<text x="600" y="68" font-size="14" font-weight="400" text-anchor="middle" fill="#52525b">紫色是固定内核（插件不可替换）；橙色虚线是扩展点，插件只能在这些位置“加东西”</text>
<rect x="40" y="190" width="1120" height="250" rx="18" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="60" y="216" font-size="15" font-weight="700" text-anchor="start" fill="#6d28d9">一个回合在内核里的主链路（liharness-core，固定）</text>
<rect x="70" y="250" width="160" height="64" rx="10" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
<text x="150.0" y="279.0" font-size="15" font-weight="600" text-anchor="middle" fill="#52525b">用户输入</text>
<text x="150.0" y="297.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52525b">回合开始</text>
<line x1="230" y1="282" x2="286" y2="282" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="288" y="250" width="160" height="64" rx="10" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
<text x="368.0" y="279.0" font-size="15" font-weight="600" text-anchor="middle" fill="#52525b">组装上下文</text>
<text x="368.0" y="297.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52525b">系统提示词 + 历史</text>
<line x1="448" y1="282" x2="504" y2="282" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="506" y="250" width="160" height="64" rx="10" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
<text x="586.0" y="279.0" font-size="15" font-weight="600" text-anchor="middle" fill="#52525b">调用模型</text>
<text x="586.0" y="297.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52525b">附带工具清单</text>
<line x1="666" y1="282" x2="722" y2="282" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="724" y="250" width="160" height="64" rx="10" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
<text x="804.0" y="279.0" font-size="15" font-weight="600" text-anchor="middle" fill="#52525b">执行工具</text>
<text x="804.0" y="297.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52525b">护栏 · 审批 · 沙箱</text>
<line x1="884" y1="282" x2="940" y2="282" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="942" y="250" width="160" height="64" rx="10" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
<text x="1022.0" y="279.0" font-size="15" font-weight="600" text-anchor="middle" fill="#52525b">回合结束</text>
<text x="1022.0" y="297.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52525b">写入会话日志</text>
<path d="M 804 314 C 804 362, 600 362, 590 318" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="697" y="376" font-size="12.5" font-weight="400" text-anchor="middle" fill="#18181b">模型要求调用工具时，执行后回到“调用模型”，直到给出最终回答</text>
<rect x="42" y="96" width="216" height="64" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="150.0" y="122" font-size="13.5" font-weight="700" text-anchor="middle" fill="#c2410c">钩子 USER_PROMPT_SUBMIT</text>
<text x="150.0" y="142" font-size="12" font-weight="400" text-anchor="middle" fill="#52525b">观察 · 补充本回合上下文</text>
<rect x="268" y="96" width="200" height="64" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="368.0" y="122" font-size="13.5" font-weight="700" text-anchor="middle" fill="#c2410c">提示词段落 · 技能</text>
<text x="368.0" y="142" font-size="12" font-weight="400" text-anchor="middle" fill="#52525b">按 order 拼进系统提示词</text>
<rect x="486" y="96" width="200" height="64" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="586.0" y="122" font-size="13.5" font-weight="700" text-anchor="middle" fill="#c2410c">工具</text>
<text x="586.0" y="142" font-size="12" font-weight="400" text-anchor="middle" fill="#52525b">说明书发给模型，模型来选</text>
<rect x="704" y="96" width="240" height="64" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="824.0" y="122" font-size="13.5" font-weight="700" text-anchor="middle" fill="#c2410c">钩子 PRE / POST_TOOL_USE</text>
<text x="824.0" y="142" font-size="12" font-weight="400" text-anchor="middle" fill="#52525b">放行 · 拒绝 · 要求审批 · 审计</text>
<rect x="962" y="96" width="190" height="64" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="1057.0" y="122" font-size="13.5" font-weight="700" text-anchor="middle" fill="#c2410c">钩子 TURN_END</text>
<text x="1057.0" y="142" font-size="12" font-weight="400" text-anchor="middle" fill="#52525b">通知 · 记录</text>
<line x1="150" y1="160" x2="150" y2="246" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<line x1="368" y1="160" x2="368" y2="246" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<line x1="586" y1="160" x2="586" y2="246" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<line x1="824" y1="160" x2="804" y2="246" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<line x1="1057" y1="160" x2="1022" y2="246" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<rect x="70" y="396" width="1060" height="28" rx="8" fill="#fafafa" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="600" y="415" font-size="12.5" font-weight="400" text-anchor="middle" fill="#444441">事件流：turn_started · delta · tool_call · tool_result · approval · compacted · done</text>
<rect x="470" y="470" width="260" height="64" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="600.0" y="496" font-size="13.5" font-weight="700" text-anchor="middle" fill="#c2410c">事件订阅</text>
<text x="600.0" y="516" font-size="12" font-weight="400" text-anchor="middle" fill="#52525b">收到回合里的每个事件，只能观察</text>
<line x1="600" y1="470" x2="600" y2="428" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<rect x="40" y="560" width="1120" height="60" rx="12" fill="#fafafa" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="60" y="584" font-size="13.5" font-weight="700" text-anchor="start" fill="#444441">插件不能替换：模型适配与模型列表 · Agent 循环 · 会话存储 · 上下文组装与压缩 · 护栏与审批主流程</text>
<text x="60" y="606" font-size="12.5" font-weight="400" text-anchor="start" fill="#52525b">这些在代码里仍是“接口 + 默认实现”，开发者改代码可以替换（比如 H2 换 PostgreSQL），但不开放给插件</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
