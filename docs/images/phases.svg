<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" role="img" aria-label="LiHarness 两阶段路线" xmlns:c2pa="http://c2pa.org/manifest">
<title>LiHarness 两阶段路线</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f3f46"/></marker>
<marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f3f46"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="600" y="42" font-size="24" font-weight="700" text-anchor="middle" fill="#18181b">两阶段路线</text>
<text x="600" y="68" font-size="14" font-weight="400" text-anchor="middle" fill="#52525b">先做一个能用的 Agent，再把它变成可扩展的平台；内核两个阶段都不变</text>
<rect x="40" y="100" width="700" height="300" rx="16" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="60" y="126" font-size="16" font-weight="700" text-anchor="start" fill="#6d28d9">第一阶段：最小可用 Harness（第 00–13 章）</text>
<rect x="60" y="146" width="320" height="100" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="76" y="174" font-size="14" font-weight="700" text-anchor="start" fill="#15803d">地基（已完成）</text>
<text x="76" y="200" font-size="12.5" font-weight="400" text-anchor="start" fill="#18181b">00 环境 · 01 后端骨架</text>
<text x="76" y="222" font-size="12.5" font-weight="400" text-anchor="start" fill="#18181b">02 桌面外壳 · 03 流式通道</text>
<rect x="400" y="146" width="320" height="100" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="416" y="174" font-size="14" font-weight="700" text-anchor="start" fill="#3f3f46">Agent 核心</text>
<text x="416" y="200" font-size="12.5" font-weight="400" text-anchor="start" fill="#18181b">04 协议与 Mock · 05 Agent Loop</text>
<text x="416" y="222" font-size="12.5" font-weight="400" text-anchor="start" fill="#18181b">06 工具系统 · 07 真模型</text>
<rect x="60" y="266" width="320" height="100" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="76" y="294" font-size="14" font-weight="700" text-anchor="start" fill="#3f3f46">工程化</text>
<text x="76" y="320" font-size="12.5" font-weight="400" text-anchor="start" fill="#18181b">08 执行观测 · 09 护栏审批</text>
<text x="76" y="342" font-size="12.5" font-weight="400" text-anchor="start" fill="#18181b">10 会话持久化 · 11 上下文</text>
<rect x="400" y="266" width="320" height="100" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="416" y="294" font-size="14" font-weight="700" text-anchor="start" fill="#3f3f46">进阶能力</text>
<text x="416" y="320" font-size="12.5" font-weight="400" text-anchor="start" fill="#18181b">12 技能、待办、子代理</text>
<text x="416" y="342" font-size="12.5" font-weight="400" text-anchor="start" fill="#18181b">13 MCP 接入</text>
<rect x="580" y="372" width="150" height="24" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="655" y="389" font-size="12.5" font-weight="700" text-anchor="middle" fill="#15803d">v0.1 MVP</text>
<rect x="780" y="100" width="380" height="300" rx="16" fill="#fff4e6" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="800" y="126" font-size="16" font-weight="700" text-anchor="start" fill="#c2410c">第二阶段：完整 Harness（第 14–19 章）</text>
<rect x="800" y="142" width="340" height="30" rx="8" fill="#ffffff" stroke="#f0a068" stroke-width="1.5"/>
<text x="816" y="162" font-size="13" font-weight="400" text-anchor="start" fill="#18181b">14 多模型管理</text>
<rect x="800" y="180" width="340" height="30" rx="8" fill="#ffffff" stroke="#f0a068" stroke-width="1.5"/>
<text x="816" y="200" font-size="13" font-weight="400" text-anchor="start" fill="#18181b">15 插件 SDK 与扩展点</text>
<rect x="800" y="218" width="340" height="30" rx="8" fill="#ffffff" stroke="#f0a068" stroke-width="1.5"/>
<text x="816" y="238" font-size="13" font-weight="400" text-anchor="start" fill="#18181b">16 插件宿主（外部 jar）</text>
<rect x="800" y="256" width="340" height="30" rx="8" fill="#ffffff" stroke="#f0a068" stroke-width="1.5"/>
<text x="816" y="276" font-size="13" font-weight="400" text-anchor="start" fill="#18181b">17 插件市场</text>
<rect x="800" y="294" width="340" height="30" rx="8" fill="#ffffff" stroke="#f0a068" stroke-width="1.5"/>
<text x="816" y="314" font-size="13" font-weight="400" text-anchor="start" fill="#18181b">18 原生能力</text>
<rect x="800" y="332" width="340" height="30" rx="8" fill="#ffffff" stroke="#f0a068" stroke-width="1.5"/>
<text x="816" y="352" font-size="13" font-weight="400" text-anchor="start" fill="#18181b">19 打包发布与评测</text>
<rect x="1000" y="372" width="140" height="24" rx="12" fill="#fff4e6" stroke="#c2410c" stroke-width="1.5"/>
<text x="1070" y="389" font-size="12.5" font-weight="700" text-anchor="middle" fill="#c2410c">v1.0</text>
<line x1="740" y1="250" x2="776" y2="250" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="600" y="436" font-size="12.5" font-weight="400" text-anchor="middle" fill="#52525b">第二阶段只是把 core 里的工具、提示词、事件接口提成插件 SDK，并加上插件宿主；Agent 循环、模型、会话、护栏都沿用第一阶段的实现</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
