<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" role="img" aria-label="LiHarness 后端模块与依赖方向" xmlns:c2pa="http://c2pa.org/manifest">
<title>LiHarness 后端模块与依赖方向</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f3f46"/></marker>
<marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f3f46"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="600" y="42" font-size="24" font-weight="700" text-anchor="middle" fill="#18181b">后端模块与依赖方向</text>
<text x="600" y="68" font-size="14" font-weight="400" text-anchor="middle" fill="#52525b">箭头表示“依赖”。实线框是第一阶段就有的模块，虚线框是第二阶段新增的</text>
<rect x="60" y="100" width="500" height="170" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="80" y="126" font-size="16" font-weight="700" text-anchor="start" fill="#047857">liharness-app（Spring Boot）</text>
<text x="80" y="152" font-size="13" font-weight="400" text-anchor="start" fill="#27272a">config / security / lifecycle：配置、令牌、看门狗、优雅关闭</text>
<text x="80" y="174" font-size="13" font-weight="400" text-anchor="start" fill="#27272a">agent：SSE 接口、回合线程池、审批接口</text>
<text x="80" y="196" font-size="13" font-weight="400" text-anchor="start" fill="#27272a">session / settings：H2 会话存储、设置、内存中的密钥</text>
<rect x="80" y="222" width="460" height="36" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="310" y="245" font-size="12.5" font-weight="400" text-anchor="middle" fill="#c2410c">plugin：插件宿主、插件工作台接口（第二阶段）</text>
<rect x="60" y="330" width="500" height="200" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="80" y="356" font-size="16" font-weight="700" text-anchor="start" fill="#6d28d9">liharness-core（纯 Java，不依赖 Spring）</text>
<text x="80" y="382" font-size="13" font-weight="400" text-anchor="start" fill="#27272a">agent：Agent 循环、取消令牌、事件</text>
<text x="80" y="406" font-size="13" font-weight="400" text-anchor="start" fill="#27272a">llm：ChatModel 接口、Mock、OpenAI 兼容适配</text>
<text x="80" y="430" font-size="13" font-weight="400" text-anchor="start" fill="#27272a">tool：Tool 接口、工具表、内置工具、工作区沙箱</text>
<text x="80" y="454" font-size="13" font-weight="400" text-anchor="start" fill="#27272a">guard / context / session：护栏、上下文与压缩、会话端口</text>
<text x="80" y="478" font-size="13" font-weight="400" text-anchor="start" fill="#27272a">skill / subagent / todo / mcp：技能、子代理、待办、MCP 客户端</text>
<rect x="680" y="330" width="460" height="140" rx="10" fill="#eef4ff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="700" y="356" font-size="16" font-weight="700" text-anchor="start" fill="#1d4ed8">liharness-plugin-api（第二阶段）</text>
<text x="700" y="382" font-size="13" font-weight="400" text-anchor="start" fill="#27272a">Plugin、PluginContext、Registration</text>
<text x="700" y="406" font-size="13" font-weight="400" text-anchor="start" fill="#27272a">Tool、ToolSpec、ToolContext（从 core 迁来）</text>
<text x="700" y="430" font-size="13" font-weight="400" text-anchor="start" fill="#27272a">HookPoint、Hook、AgentEvent</text>
<rect x="680" y="100" width="460" height="120" rx="10" fill="#fff4e6" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="700" y="126" font-size="16" font-weight="700" text-anchor="start" fill="#c2410c">外部插件 jar（第二阶段）</text>
<text x="700" y="152" font-size="13" font-weight="400" text-anchor="start" fill="#27272a">只依赖 plugin-api（provided 作用域）</text>
<text x="700" y="174" font-size="13" font-weight="400" text-anchor="start" fill="#27272a">独立类加载器：看不到 core、app 和 Spring</text>
<text x="700" y="196" font-size="13" font-weight="400" text-anchor="start" fill="#27272a">例：PPT 生成、Jira 工具、审计钩子</text>
<line x1="310" y1="270" x2="310" y2="326" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="322" y="302" font-size="12.5" font-weight="400" text-anchor="start" fill="#27272a">依赖</text>
<line x1="910" y1="220" x2="910" y2="326" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="922" y="278" font-size="12.5" font-weight="400" text-anchor="start" fill="#27272a">只依赖它</text>
<line x1="560" y1="430" x2="678" y2="430" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="619.0" y="420" font-size="12.5" font-weight="400" text-anchor="middle" fill="#27272a">实现 / 使用</text>
<path d="M 560 200 C 620 200, 620 120, 678 160" fill="none" stroke="#3f3f46" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="585" y="104" font-size="12.5" font-weight="400" text-anchor="start" fill="#18181b">宿主加载</text>
<text x="585" y="120" font-size="11.5" font-weight="400" text-anchor="start" fill="#52525b">（第二阶段）</text>
<text x="600" y="580" font-size="12.5" font-weight="400" text-anchor="middle" fill="#b91c1c">规则：core 不依赖 Spring；插件只依赖 plugin-api；插件不能替换 core 里的任何实现，只能通过扩展点增加能力</text>
<text x="600" y="604" font-size="12.5" font-weight="400" text-anchor="middle" fill="#52525b">第 15 章把 Tool 等接口从 core 迁到 plugin-api，此后 core 依赖 plugin-api，内置工具和插件工具共用同一接口</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
