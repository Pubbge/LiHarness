<text x="444" y="422" font-size="13" font-weight="400" text-anchor="middle" fill="#3f3f46">compaction-core</text>
<rect x="528" y="398" width="144" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="600" y="422" font-size="13" font-weight="400" text-anchor="middle" fill="#3f3f46">session-h2</text>
<rect x="684" y="398" width="144" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="756" y="422" font-size="13" font-weight="400" text-anchor="middle" fill="#3f3f46">llm-openai</text>
<rect x="840" y="398" width="144" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="912" y="422" font-size="13" font-weight="400" text-anchor="middle" fill="#3f3f46">llm-mock</text>
<rect x="996" y="398" width="144" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="1068" y="422" font-size="13" font-weight="400" text-anchor="middle" fill="#3f3f46">tools-core</text>
<rect x="60" y="450" width="144" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="132" y="474" font-size="13" font-weight="400" text-anchor="middle" fill="#3f3f46">tools-builtin</text>
<rect x="216" y="450" width="144" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="288" y="474" font-size="13" font-weight="400" text-anchor="middle" fill="#3f3f46">guard-core</text>
<rect x="372" y="450" width="144" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="444" y="474" font-size="13" font-weight="400" text-anchor="middle" fill="#3f3f46">approval-core</text>
<rect x="528" y="450" width="144" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="600" y="474" font-size="13" font-weight="400" text-anchor="middle" fill="#3f3f46">skills</text>
<rect x="684" y="450" width="144" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="756" y="474" font-size="13" font-weight="400" text-anchor="middle" fill="#3f3f46">subagent</text>
<rect x="840" y="450" width="144" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="912" y="474" font-size="13" font-weight="400" text-anchor="middle" fill="#3f3f46">mcp</text>
<rect x="996" y="450" width="144" height="38" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1068" y="474" font-size="13" font-weight="400" text-anchor="middle" fill="#c2410c">外部插件 jar</text>
<line x1="600" y1="170" x2="600" y2="238" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="612" y="208" font-size="12.5" font-weight="400" text-anchor="start" fill="#27272a">运行时依赖</text>
<path d="M 420 135 C 200 135, 140 300, 140 356" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="160" y="250" font-size="12.5" font-weight="400" text-anchor="start" fill="#18181b">打包内置插件</text>
<path d="M 780 275 C 980 275, 1060 420, 1060 470" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="930" y="300" font-size="12.5" font-weight="400" text-anchor="start" fill="#18181b">按需加载</text>
<text x="930" y="318" font-size="11.5" font-weight="400" text-anchor="start" fill="#52525b">（ApiFirstClassLoader）</text>
<line x1="1010" y1="170" x2="780" y2="250" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M 860 135 C 820 135, 820 200, 820 356" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="826" y="226" font-size="12" font-weight="400" text-anchor="start" fill="#18181b">评测要用的插件</text>
<path d="M 420 300 C 20 300, 14 600, 296 604" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="36" y="540" font-size="12" font-weight="400" text-anchor="start" fill="#18181b">kernel 依赖 api</text>
<line x1="600" y1="510" x2="600" y2="558" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="612" y="540" font-size="12.5" font-weight="400" text-anchor="start" fill="#27272a">所有插件只依赖 plugin-api（provided / compile）</text>
<text x="600" y="672" font-size="12.5" font-weight="400" text-anchor="middle" fill="#b91c1c">规则：插件之间不互相依赖，只通过服务交流；kernel 与 plugin-api 不依赖 Spring；外部插件看不到宿主内部的类</text>
</svg>
