<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" role="img" aria-label="LiHarness 后端模块与依赖方向">
<title>LiHarness 后端模块与依赖方向</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f3f46"/></marker>
<marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f3f46"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="600" y="42" font-size="24" font-weight="700" text-anchor="middle" fill="#18181b">后端模块与依赖方向</text>
<text x="600" y="68" font-size="14" font-weight="400" text-anchor="middle" fill="#52525b">箭头表示“依赖”。所有依赖都指向 plugin-api：契约最稳定，放在最底层</text>
<rect x="420" y="100" width="360" height="70" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="600.0" y="132.0" font-size="16" font-weight="600" text-anchor="middle" fill="#047857">liharness-app</text>
<text x="600.0" y="150.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52525b">Spring Boot 外壳 · REST/SSE · H2 · 外部插件加载</text>
<rect x="860" y="100" width="300" height="70" rx="10" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
<text x="1010.0" y="132.0" font-size="16" font-weight="600" text-anchor="middle" fill="#52525b">liharness-eval</text>
<text x="1010.0" y="150.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52525b">评测：无界面组装内核（第 19 章）</text>
<rect x="420" y="240" width="360" height="70" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="600.0" y="272.0" font-size="16" font-weight="600" text-anchor="middle" fill="#6d28d9">liharness-kernel</text>
<text x="600.0" y="290.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52525b">插件运行时 · 服务栈 · 事件总线 · 生命周期（纯 Java）</text>
<rect x="300" y="560" width="600" height="80" rx="10" fill="#eef4ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="600.0" y="597.0" font-size="17" font-weight="600" text-anchor="middle" fill="#1d4ed8">liharness-plugin-api</text>
<text x="600.0" y="615.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52525b">契约：Plugin · PluginContext · ChatModel · Tool · AgentRunner · GuardChain · AgentEvent …</text>
<rect x="40" y="360" width="1120" height="150" rx="14" fill="#fafafa" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="60" y="384" font-size="13" font-weight="600" text-anchor="start" fill="#71717a">liharness-plugins/*（内置插件，通过 ServiceLoader 发现）</text>
<rect x="60" y="398" width="144" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="132" y="422" font-size="13" font-weight="400" text-anchor="middle" fill="#3f3f46">agent-loop</text>
<rect x="216" y="398" width="144" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="288" y="422" font-size="13" font-weight="400" text-anchor="middle" fill="#3f3f46">context-core</text>
